<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智慧停车运营平台 · 订单管理</title>
  <link rel="icon" href="./img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./css/common.css">
  <link rel="stylesheet" href="./css/admin.css">
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-side">
      <div class="admin-logo">
        <svg viewBox="0 0 32 32"><rect width="32" height="32" rx="7" fill="#2563EB"/><path d="M11 24V13h8a4 4 0 0 1 0 8h-4v3z" fill="none" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"/><path d="M11 17h7a1.5 1.5 0 0 0 0-3h-7" fill="none" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"/></svg>
        智慧停车
      </div>
      <nav class="admin-nav">
        <a href="admin-dashboard.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>数据看板</a>
        <a href="admin-slots.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M10 16V9h3a2 2 0 0 1 0 4h-3"/></svg>车位管理</a>
        <a href="admin-pricing.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M15 9.5c0-1.4-1.3-2.5-3-2.5s-3 1-3 2.2c0 3 6 1.6 6 4.6 0 1.2-1.3 2.2-3 2.2s-3-1.1-3-2.5"/></svg>计费规则</a>
        <a href="admin-orders.html" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>订单管理</a>
        <a class="disabled"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-2-1.2L14 3h-4l-.5 2.6a7 7 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.6A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 2 1.2L10 21h4l.5-2.6a7 7 0 0 0 2-1.2l2.4 1 2-3.4-2-1.6c.1-.4.1-.8.1-1.2z"/></svg>设置（无权限）</a>
      </nav>
    </aside>

    <div class="admin-main">
      <header class="admin-top">
        <button class="switcher" id="parkSwitcher">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="M4 10h16"/></svg>
          <span id="curPark">万象城停车场</span>
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#64748B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <div class="top-right">
          <span class="bell" title="消息"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 9a6 6 0 1 1 12 0c0 5 2 6 2 6H4s2-1 2-6"/><path d="M10 20a2 2 0 0 0 4 0"/></svg><span class="reddot"></span></span>
          <span class="avatar">管</span>
        </div>
      </header>

      <main class="admin-content">
        <h1 class="page-title">订单管理</h1>

        <!-- 筛选查询区 -->
        <div class="card" style="padding:12px 16px">
          <div class="flex center gap3" style="flex-wrap:wrap">
            <input class="input" id="fPlate" placeholder="车牌号，如 京A·12345" style="width:160px;height:32px">
            <select class="select" id="fStatus" style="width:130px;height:32px">
              <option value="all">全部状态</option>
              <option value="reserved">预约中</option>
              <option value="parking">在停</option>
              <option value="paid">已完成</option>
              <option value="refunding">退款中</option>
              <option value="refunded">已退款</option>
              <option value="unpaid">待支付</option>
              <option value="expired">已超时</option>
            </select>
            <input class="input" type="date" id="fDate" value="2026-09-08" style="width:150px;height:32px">
            <!-- 点击后按条件调用 GET /api/admin/orders?plate=&status=&date= -->
            <button class="btn btn-md btn-primary" id="btnQuery">查询</button>
            <button class="btn btn-md btn-text" id="btnClear">重置</button>
          </div>
        </div>

        <!-- 订单表格（JS 渲染） -->
        <div class="tbl-wrap" id="orderTblWrap">
          <table class="tbl" id="orderTbl">
            <thead>
              <tr>
                <th style="width:40px"><input type="checkbox" id="chkAll" title="全选"></th>
                <th>订单号</th><th>车牌</th><th>车场</th><th>时段</th><th>金额</th><th>状态</th><th>操作</th>
              </tr>
            </thead>
            <tbody id="orderTbody"></tbody>
          </table>
        </div>
      </main>
    </div>
  </div>

  <!-- 吸底批量操作栏 -->
  <div class="batch-bar" id="batchBar">
    <span class="text-sm text-secondary">已选 <b id="selCount" class="text-blue">0</b> 个订单</span>
    <div class="flex gap3">
      <!-- 批量退款：POST /api/admin/orders/batch-refund -->
      <button class="btn btn-md btn-danger" data-op="refund">批量退款</button>
      <!-- 强制结算：POST /api/admin/orders/batch-settle（不可逆，需二次确认） -->
      <button class="btn btn-md btn-primary" data-op="settle">强制结算</button>
      <button class="btn btn-md btn-text" data-op="cancel">取消</button>
    </div>
  </div>

  <div class="toast-wrap" id="toastWrap"></div>
  <script src="./js/common.js"></script>
  <script src="./js/admin-orders.js"></script>
</body>
</html>
