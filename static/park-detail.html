<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智慧停车 · 车场详情</title>
  <link rel="icon" href="./img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./css/common.css">
  <link rel="stylesheet" href="./css/mobile-pages.css">
</head>
<body>
  <div class="viewport">
    <div class="phone-frame">
      <div class="screen">

        <header class="topbar">
          <span class="topbar__back" onclick="history.back()">‹</span>
          <span class="topbar__title">车场详情</span>
          <span class="topbar__action"></span>
        </header>

        <main class="screen__main">
          <!-- 车场主图（矢量占位） -->
          <div class="hero">
            <svg viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <rect x="8" y="10" width="32" height="30" rx="6"/>
              <path d="M11 17h7a1.5 1.5 0 0 0 0-3h-7M11 14v13"/>
              <path d="M33 27v-8h6M39 23h-6"/>
            </svg>
            <span class="hero__badge">实景 · B1 层</span>
          </div>

          <!-- 车场信息 -->
          <h2 class="park-title">万象城停车场</h2>
          <div class="park-meta">
            <span>1.2 km</span><span>步行 8 分钟</span><span>营业 06:00–23:00</span>
          </div>

          <!-- 实时余位 -->
          <div class="card mt4">
            <div class="flex center between">
              <span class="text-sm text-tertiary">实时余位</span>
              <span class="text-xs text-tertiary flex center gap2"><span class="dot-live"></span>刚刚更新</span>
            </div>
            <div class="mt3" style="font-size:28px;font-weight:700;color:var(--n-900)">
              38 <small style="font-size:13px;font-weight:400;color:var(--text-tertiary)">/ 200 · 空闲率 19%</small>
            </div>
          </div>

          <!-- 费率说明 -->
          <div class="card mt4">
            <div class="fw600 mb3" style="font-size:15px">计费规则</div>
            <div class="rate-row"><span>免费时长</span><span class="tabular">入场后 30 分钟内免费</span></div>
            <div class="rate-row"><span>首小时</span><span class="tabular">¥10.00</span></div>
            <div class="rate-row"><span>后续每 30 分钟</span><span class="tabular">¥3.00</span></div>
            <div class="rate-row"><span>每日封顶</span><span class="tabular">¥60.00</span></div>
            <div class="rate-row"><span>夜间 22:00–08:00</span><span class="tabular">上限 ¥15.00</span></div>
            <div class="rate-row"><span>新能源车型系数</span><span class="tabular">×0.9</span></div>
          </div>

          <!-- 日期选择 -->
          <div class="section-label" style="margin-top:20px">选择日期</div>
          <div class="date-row" id="dateRow">
            <button class="date-chip active" data-date="09-08">今天<small>09-08</small></button>
            <button class="date-chip" data-date="09-09">明天<small>09-09</small></button>
            <button class="date-chip" data-date="09-10">周三<small>09-10</small></button>
            <button class="date-chip" data-date="09-11">周四<small>09-11</small></button>
          </div>

          <!-- 时段选择（可选 / 已选 / 已满 / 冲突） -->
          <div class="section-label">选择时段</div>
          <div class="slot-grid" id="slotGrid">
            <button class="slot-time" data-t="10:00–13:00" data-p="22">10:00–13:00<small>预估 ¥22.00</small></button>
            <button class="slot-time selected" data-t="13:00–16:00" data-p="22">13:00–16:00<small>预估 ¥22.00</small></button>
            <button class="slot-time full" data-t="08:00–11:00" data-p="0">08:00–11:00<small>已满</small></button>
            <button class="slot-time conflict" data-t="16:00–19:00" data-p="0">16:00–19:00<small>与已有预约冲突</small></button>
            <button class="slot-time" data-t="19:00–22:00" data-p="16">19:00–22:00<small>预估 ¥16.00</small></button>
            <button class="slot-time" data-t="22:00–08:00" data-p="15">22:00–08:00<small>夜间上限 ¥15.00</small></button>
          </div>
        </main>

        <!-- 底部固定 CTA：跳转预约确认页 -->
        <div class="cta-bar">
          <button type="button" class="btn btn-xl btn-primary" id="btnReserve">立即预约</button>
        </div>

      </div>
    </div>
  </div>

  <div class="toast-wrap" id="toastWrap"></div>
  <script src="./js/common.js"></script>
  <script src="./js/park-detail.js"></script>
</body>
</html>
